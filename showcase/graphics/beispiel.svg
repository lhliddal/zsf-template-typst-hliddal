<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" width="150" height="100">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#F1F5F9" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background & Blueprint grid -->
  <rect width="150" height="100" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>
  <rect width="150" height="100" fill="url(#grid)"/>

  <!-- Construction / Diagonals (subtle) -->
  <line x1="0" y1="0" x2="150" y2="100" stroke="#E2E8F0" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="0" y1="100" x2="150" y2="0" stroke="#E2E8F0" stroke-width="0.6" stroke-dasharray="3 3"/>

  <!-- Coordinate system -->
  <line x1="20" y1="80" x2="135" y2="80" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="20" y1="80" x2="20" y2="15" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="135" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B">x</text>
  <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B">y</text>

  <!-- Mathematical Curve (Parabola / Trajectory) -->
  <path d="M 20 80 Q 60 15 115 45" fill="none" stroke="#334155" stroke-width="1.8"/>

  <!-- Tangent / Indicator line -->
  <line x1="45" y1="80" x2="45" y2="44" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="20" y1="44" x2="45" y2="44" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <circle cx="45" cy="44" r="2" fill="#334155"/>

  <!-- Labels -->
  <text x="40" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#64748B">x₀</text>
  <text x="8" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#64748B">y₀</text>
  <text x="98" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-style="italic" font-weight="600" fill="#1E293B">f(x)</text>

  <!-- Technical Spec Badge -->
  <rect x="95" y="8" width="48" height="14" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="119" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">FIG. 01</text>
</svg>
